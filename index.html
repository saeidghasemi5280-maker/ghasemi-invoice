<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فاکتور گالری نقره قاسمی</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فاکتور قاسمی">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
#stage{position:relative;width:100%;max-width:900px;margin:0 auto;--k:.4;user-select:none;-webkit-user-select:none}
#stage img{display:block;width:100%;height:auto;-webkit-user-drag:none}
.f{position:absolute;border:0;background:transparent;color:var(--ink,#15171b);padding:0 6px;font:inherit;font-size:calc(max(16px,var(--k)*27px)*var(--fs,1));outline:0;border-radius:8px;user-select:text;-webkit-user-select:text;direction:rtl;text-align:right}
.f.c{text-align:center;direction:ltr}.f.l{direction:ltr}.f.b{font-weight:700}
.f:focus,.f.on{box-shadow:inset 0 0 0 2px #15171b55;background:#ffffff40}
.f.nop{padding:0}
.f.wd{color:#eef0f3;font-size:calc(max(16px,var(--k)*24px)*var(--fs,1));border-bottom:1px dotted #8a9099;border-radius:0;padding:0 2px}
.t{position:absolute;display:flex;align-items:center;justify-content:center;color:var(--ink,#15171b);font-size:calc(var(--k)*27px*var(--fs,1));direction:ltr;pointer-events:none}
.btn{position:absolute;border:0;background:transparent;border-radius:calc(var(--k)*22px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active,.opt:active{background:#ffffff33}
.opt{position:absolute;border:0;background:transparent;border-radius:calc(var(--k)*10px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt.sel{background:#ffffff26}
#bar{max-width:900px;margin:14px auto 0;padding:0 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#bar button{min-height:52px;border-radius:16px;border:1px solid #4a4f57;background:linear-gradient(180deg,#2a2d33,#0e1013);color:#e6e9ee;font:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff22;-webkit-tap-highlight-color:transparent}
#bar button.m{background:linear-gradient(180deg,#f6f8fb,#a9afb8);color:#111;border-color:#fff}
#bar button:active{transform:translateY(1px);filter:brightness(.9)}
#plist{position:absolute;z-index:5}
#plist img{display:block;width:100%;height:100%;pointer-events:none}
#tools{max-width:900px;margin:14px auto 0;padding:12px;background:#121417;border:1px solid #3a3e45;border-radius:18px;color:#dfe3e8;width:calc(100% - 24px)}
#tools .tt{font-size:14px;color:#a9afb8;margin:2px 0 8px}
#themes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
#themes button{background:none;border:0;color:#dfe3e8;font:inherit;font-size:11px;line-height:1.3;cursor:pointer;padding:2px 0;-webkit-tap-highlight-color:transparent}
#themes i{display:block;width:40px;height:40px;border-radius:50%;margin:0 auto 4px;border:2px solid #3a3e45;box-shadow:inset 0 2px 3px #ffffff55,inset 0 -3px 4px #0006}
#themes button.on i{border-color:#fff;box-shadow:0 0 0 2px #ffffff55,inset 0 2px 3px #ffffff55}
#fsrow{display:flex;align-items:center;gap:8px}
#fsrow button{min-height:44px;min-width:56px;border-radius:12px;border:1px solid #4a4f57;background:#1b1d22;color:#e6e9ee;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
#fsrow span{flex:1;text-align:center;font-weight:600}
#more{max-width:900px;margin:0 auto;padding:10px;text-align:center}
#more button{background:#1b1d22;color:#dfe3e8;border:1px solid #3a3e45;border-radius:12px;min-height:44px;padding:0 18px;font:inherit;font-size:15px;cursor:pointer}
#sheet{position:fixed;top:0;left:0;right:0;z-index:20;background:#121417;border-bottom:1px solid #3a3e45;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 12px;display:none;color:#dfe3e8}
#sheet.on{display:block}
#sheet label{font-size:14px;color:#a9afb8}
#sin{width:100%;min-height:50px;font:inherit;font-size:18px;border-radius:12px;border:0;padding:0 12px;margin:6px 0 10px;background:#e4e7ec;color:#14161a}
#sheet .rw{display:flex;gap:8px}
#sheet .rw button{flex:1;min-height:46px;border-radius:12px;border:1px solid #3a3e45;background:#1b1d22;color:#dfe3e8;font:inherit;font-size:15px}
#sheet .rw button.m{background:#e4e7ec;color:#111}
dialog{background:#121417;color:#dfe3e8;border:1px solid #3a3e45;border-radius:18px;max-width:420px;width:92%;padding:16px}
#imd{max-height:94vh;overflow:auto}
.r2{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}
.o2.pri{background:linear-gradient(180deg,#f6f8fb,#a9afb8);color:#111;border-color:#fff;text-align:center;font-weight:700}
.r2 .o2{margin:0;text-align:center}
dialog::backdrop{background:#000a}
.o2{display:block;width:100%;text-align:right;margin:6px 0;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid #3a3e45;background:#1b1d22;color:#dfe3e8;font:inherit;font-size:15px;cursor:pointer}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #3a3e45;padding:8px 0}
.li button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #3a3e45;background:#1b1d22;color:#dfe3e8;font:inherit;cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
@page{margin:0}
@media print{#tools,#bar,#more,#sheet,.btn,.opt{display:none!important}body{background:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}#stage{max-width:none}}
</style>
</head>

function renderImg(){
  plOpen(false);
  const w=base.naturalWidth||1024,h=base.naturalHeight||1536,c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(imgEl,0,0,w,h);
  const k=(st.clientWidth/W)||1,sc=w/W;
  st.querySelectorAll('.f,.t').forEach(el=>{
    const isIn=el.tagName==='INPUT',txt=isIn?el.value:el.textContent;
    if(!txt||!el.dataset.g)return;
    const g=el.dataset.g.split(',').map(Number),cs=getComputedStyle(el);
    let fsz=parseFloat(cs.fontSize)/k;
    if(isIn)fsz=Math.min(fsz,(el.classList.contains('wd')?24:27)*fs);
    x.font=cs.fontWeight+' '+(fsz*sc)+'px '+cs.fontFamily;
    x.fillStyle=cs.color;x.textBaseline='middle';x.direction=cs.direction==='rtl'?'rtl':'ltr';
    let al=isIn?cs.textAlign:(el.dataset.al==='r'?'right':'center');
    if(al==='start')al=cs.direction==='rtl'?'right':'left';else if(al==='end')al=cs.direction==='rtl'?'left':'right';
    const pad=isIn?(el.classList.contains('nop')?0:6/k):(el.dataset.al==='r'?(parseFloat(cs.paddingRight)||0)/k:0);
    const px=al==='center'?g[0]+g[2]/2:(al==='right'?g[0]+g[2]-pad:g[0]+pad);
    x.textAlign=al;x.fillText(txt,px*sc,(g[1]+g[3]/2)*sc);
  });
  return c.toDataURL('image/jpeg',.95);
}
function showImg(){try{$('#imi').src=renderImg();$('#imd').showModal();return true}catch(e){toast('ساخت تصویر انجام نشد');return false}}
function imgFile(){
  const d=$('#imi').src,bs=atob(d.split(',')[1]),u=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u[i]=bs.charCodeAt(i);
  return new File([u],'ghasemi-invoice-'+(toEn(byId.inv.el.value)||'1')+'.jpg',{type:'image/jpeg'});
}
let DL=null;
(async()=>{try{if(typeof claude!=='undefined')DL=await claude.use('downloads')}catch(e){DL=null}})();
async function shareImg(auto){
  const f=imgFile();
  if(DL){
    try{await DL.save({filename:f.name,data:f});toast('تصویر فاکتور ذخیره شد');return true}
    catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return false}
  }
  if(typeof claude==='undefined'){
    try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('تصویر فاکتور در پوشه دانلودها ذخیره شد');return true}catch(e){}
  }
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'فاکتور گالری نقره قاسمی'});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  if(!auto)toast('انگشت را روی عکس نگه دارید و «ذخیره تصویر» را بزنید');
  return false;
}

/* calc */
function calc(){
  let gt=0,gw=0;
  for(let r=0;r<7;r++){
    const w=parseFloat(toEn(byId['w'+r].el.value))||0,p=parseFloat(toEn(byId['p'+r].el.value))||0;
    const t=Math.round(w*p);gt+=t;gw+=w;
    $('#t'+r).textContent=(w&&p)?fa(t):'';
  }
  $('#gt').textContent=gt?fa(gt):'';$('#gw').textContent=gw?fa(Math.round(gw*1000)/1000):'';
  return{gt,gw};
}

let cur=0;

function openSheet(i){
  if(i<0||i>=F.length){$('#sheet').classList.remove('on');F.forEach(f=>f.el.classList.remove('on'));return}
  F.forEach(f=>f.el.classList.remove('on'));
  cur=i;const f=F[i];f.el.classList.add('on');
  $('#slab').textContent=f.label;sin.value=f.el.value;

  $('#sheet').classList.add('on');setTimeout(()=>{sin.focus();sin.select()},30);
}

/* data */
function jalaliToday(){
  try{const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
    const g=t=>p.find(x=>x.type===t).value;return[g('year'),g('month'),g('day')]}catch(e){return['','','']}
}
function setDate(a){byId.dy.el.value=pd(a[0]);byId.dm.el.value=pd(a[1]);byId.dd.el.value=pd(a[2])}
function newInvoice(){
  F.forEach(f=>f.el.value='');
  setDate(jalaliToday());byId.inv.el.value=pd(store.get(CNT,0)+1);autoWd();setPay(0);calc();
}
function collect(){
  const v=id=>byId[id].el.value;
  const rows=[];
  for(let r=0;r<7;r++){const o={d:v('d'+r).trim(),w:toEn(v('w'+r)),p:toEn(v('p'+r))};if(o.d||o.w||o.p)rows.push(o)}
  return{no:toEn(v('inv')),date:[v('dy'),v('dm'),v('dd')].map(toEn),buyer:v('buyer').trim(),wd:v('wd').trim(),note:v('note').trim(),phone:toEn(v('phone')),pay:PAY[pay],rows,saved:Date.now()};
}
function load(o){
  F.forEach(f=>f.el.value='');
  const n=String(o.no).split('/');byId.inv.el.value=pd(n[n.length-1]||'');
  setDate(o.date);
  byId.buyer.el.value=o.buyer;byId.phone.el.value=pd(o.phone||'');
  o.rows.slice(0,7).forEach((r,i)=>{byId['d'+i].el.value=r.d;byId['w'+i].el.value=r.w?pd(r.w):'';byId['p'+i].el.value=r.p?fa(r.p):''});
  byId.wd.el.value=o.wd||'';byId.note.el.value=o.note||'';setPay(Math.max(0,PAY.indexOf(o.pay)));calc();
}
function text(o){
  const L=['🧾 فاکتور گالری نقره قاسمی','شماره: '+pd(o.no)+'   تاریخ: '+(o.wd?o.wd+' ':'')+o.date.map(pd).join('/')];
  if(o.buyer)L.push('خریدار: '+o.buyer);if(o.phone)L.push('تلفن: '+pd(o.phone));
  L.push('------------------');
  o.rows.forEach((r,i)=>{const t=Math.round((parseFloat(r.w)||0)*(parseFloat(r.p)||0));L.push(fa(i+1)+'. '+(r.d||'-')+' | '+pd(r.w||0)+' گرم × '+fa(r.p||0)+' = '+fa(t)+' تومان')});
  const c=calc();L.push('------------------','وزن کل: '+fa(c.gw)+' گرم','جمع کل: '+fa(c.gt)+' تومان','نحوه پرداخت: '+o.pay,...(o.note?['توضیحات: '+o.note]:[]),'','📞 09365440042','Instagram: silver999_ghasemi');
  return L.join('\n');
}
function save(quiet){
  const o=collect();
  if(!o.rows.length){toast('حداقل یک ردیف کالا وارد کنید');return false}
  const all=store.get(KEY,[]).filter(x=>x.no!==o.no);all.unshift(o);
  const ok=store.set(KEY,all);
  const n=parseInt(String(o.no).split('/').pop());if(n>store.get(CNT,0))store.set(CNT,n);
  if(!quiet)toast(ok?'فاکتور ذخیره شد':'ذخیره انجام نشد');return ok;
}
function renderList(){
  const all=store.get(KEY,[]),el=$('#list');
  if(!all.length){el.innerHTML='<p style="color:#a9afb8">هنوز فاکتوری ذخیره نشده است.</p>';return}
  el.innerHTML='';
  all.forEach(o=>{
    const t=o.rows.reduce((s,r)=>s+Math.round((parseFloat(r.w)||0)*(parseFloat(r.p)||0)),0);
    const d=document.createElement('div');d.className='li';
    const a=document.createElement('div');a.innerHTML='<b></b> <span></span><br><small></small>';
    a.querySelector('b').textContent='#'+pd(o.no);a.querySelector('span').textContent=o.buyer||'بدون نام';a.querySelector('small').textContent=fa(t)+' تومان';
    const b=document.createElement('div');
    const bo=document.createElement('button');bo.textContent='باز کردن';bo.onclick=()=>{load(o);$('#dl').close()};
    const bd=document.createElement('button');bd.textContent='حذف';bd.onclick=()=>{store.set(KEY,store.get(KEY,[]).filter(x=>x.no!==o.no));renderList()};
    b.append(bo,' ',bd);d.append(a,b);el.appendChild(d);
  });
}

/* themes */
const THEMES=[
{n:'نقره‌ای متالیک',ink:'#15171b',bg:'#000000',st:null,sw:['#f7f9fc','#aeb4bd','#4a4f57']},
{n:'رزگلد',ink:'#2e1412',bg:'#0e0708',st:[[0,'#0e0708'],[.3,'#4d2a2c'],[.55,'#a8606a'],[.8,'#e3ae9f'],[1,'#fde6dc']]},
{n:'زرشکی آتشین',ink:'#2a0508',bg:'#0a0102',st:[[0,'#0a0102'],[.3,'#4a0612'],[.55,'#a30f24'],[.8,'#ee5a2c'],[1,'#ffd0a8']]},
{n:'آبی لاجوردی',ink:'#06142e',bg:'#02060f',st:[[0,'#02060f'],[.3,'#0b2a6b'],[.55,'#2a63b0'],[.8,'#86abe6'],[1,'#e0ecff']]},
{n:'سبز یشمی',ink:'#032014',bg:'#020a06',st:[[0,'#020a06'],[.3,'#0b4a34'],[.55,'#0aa56c'],[.8,'#92e2bb'],[1,'#e3fcef']]},
{n:'مشکی براق',ink:'#f1f3f6',bg:'#000000',st:[[0,'#000000'],[.25,'#16181c'],[.5,'#2c3037'],[.75,'#4b515b'],[1,'#8b919c']],sw:['#555b66','#1a1c20','#000000']}
];
const TKEY='ghasemi_theme_v1';let th=0,fs=1;
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function lut(s){const o=[];for(let i=0;i<256;i++){const L=i/255;let k=1;while(k<s.length-1&&L>s[k][0])k++;const a=s[k-1],b=s[k],u=Math.min(1,Math.max(0,(L-a[0])/(b[0]-a[0]))),ca=hex(a[1]),cb=hex(b[1]);o.push([0,1,2].map(j=>Math.round(ca[j]+(cb[j]-ca[j])*u)))}return o}
const imgEl=st.querySelector('img'),SRC=imgEl.src,base=new Image(),ready=new Promise(r=>{base.onload=r});base.src=SRC;
const LSRC=pli.src,lbase=new Image(),lready=new Promise(r=>{lbase.onload=r});lbase.src=LSRC;
const cache={};
THEMES.forEach((T,i)=>{
  const sw=T.sw||(T.st?[T.st[4][1],T.st[2][1],T.st[1][1]]:[]);
  const b=document.createElement('button');b.setAttribute('aria-label',T.n);
  b.innerHTML='<i style="background:linear-gradient(145deg,'+sw.join(',')+')"></i>'+T.n;
  b.onclick=()=>applyTheme(i);$('#themes').appendChild(b);
});
function recolor(im,T){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data,L=lut(T.st);for(let q=0;q<p.length;q+=4){const l=(p[q]*77+p[q+1]*150+p[q+2]*29)>>8;let u=(l/255-.32)/.3;u=u<0?0:u>1?1:u;const w=1-u*u*(3-2*u),m=L[Math.min(255,Math.round(l*2.8))];p[q]=m[0]*w+p[q]*(1-w);p[q+1]=m[1]*w+p[q+1]*(1-w);p[q+2]=m[2]*w+p[q+2]*(1-w)}x.putImageData(d,0,0);return c.toDataURL('image/jpeg',.92)}
async function applyTheme(i){
  th=i;const T=THEMES[i];
  st.style.setProperty('--ink','#15171b');document.body.style.background=T.bg;
  [...$('#themes').children].forEach((b,j)=>b.classList.toggle('on',j===i));
  if(!T.st){imgEl.src=SRC;pli.src=LSRC}
  else{
    if(!cache[i]){await Promise.all([ready,lready]);cache[i]=[recolor(base,T),recolor(lbase,T)]}
    if(th===i){imgEl.src=cache[i][0];pli.src=cache[i][1]}
  }
  store.set(TKEY,{th:i,fs});
}
function setFs(v){fs=Math.min(1.5,Math.max(.7,Math.round(v*10)/10));st.style.setProperty('--fs',fs);$('#fsv').textContent=pd(Math.round(fs*100))+'٪';store.set(TKEY,{th,fs})}
$('#fsp').onclick=()=>setFs(fs+.1);$('#fsm').onclick=()=>setFs(fs-.1);$('#fsr').onclick=()=>setFs(1);
modeSet();newInvoice();fit();
const sv=store.get(TKEY,{th:0,fs:1});setFs(sv.fs||1);applyTheme(sv.th||0);
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
